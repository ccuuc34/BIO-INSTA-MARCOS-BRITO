<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suporte Prioritário | Marcos Brito</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      min-height: 100vh;
      font-family: 'Nunito', sans-serif;
      background-color: #150825;
      color: #F6F6F6;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    body::after {
      content: '';
      position: fixed; top: 0; left: 50%; transform: translateX(-50%);
      width: 700px; height: 350px;
      background: #8b171a;
      border-radius: 50%; filter: blur(180px); opacity: 0.2;
      pointer-events: none; z-index: 0;
    }

    .page { position: relative; z-index: 1; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 44px 20px 56px; }
    .card { width: 100%; max-width: 440px; text-align: center; }

    .eyebrow-row { margin-bottom: 22px; }
    .eyebrow {
      font-family: 'Sora', sans-serif; font-weight: 800; font-size: 11px;
      color: #AF9064; background: rgba(175,144,100,0.1); border: 1px solid rgba(175,144,100,0.3);
      display: inline-flex; align-items: center; gap: 6px; padding: 7px 16px; border-radius: 100px;
      letter-spacing: 0.12em; text-transform: uppercase;
    }

    .headline {
      font-family: 'Sora', sans-serif; font-weight: 800;
      font-size: clamp(24px, 7vw, 32px); color: #F6F6F6;
      line-height: 1.22; margin-bottom: 6px;
    }
    .brand-line {
      font-family: 'Sora', sans-serif; font-weight: 700; font-size: 15px;
      color: #8b171a; letter-spacing: 0.04em;
      text-transform: uppercase; margin-bottom: 24px;
    }

    .desc {
      font-family: 'Nunito', sans-serif; font-weight: 500; font-size: 15.5px;
      color: rgba(246,246,246,0.66); line-height: 1.75;
      margin-bottom: 34px;
    }
    .desc strong { color: #F6F6F6; font-weight: 700; }

    .whats-btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; padding: 18px 20px; border-radius: 14px;
      font-family: 'Sora', sans-serif; font-weight: 800; font-size: 15px;
      letter-spacing: 0.02em; text-transform: uppercase;
      text-decoration: none; border: none; cursor: pointer;
      background: #0abe52; color: #fff;
      box-shadow: 0 12px 30px rgba(10,190,82,0.28);
      transition: transform 0.12s;
    }
    .whats-btn:active { transform: scale(0.98); }
    .whats-btn svg { width: 22px; height: 22px; flex-shrink: 0; }

    .number-line {
      font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px;
      color: rgba(246,246,246,0.5); margin-top: 18px; letter-spacing: 0.02em;
    }

    .footer-note {
      font-family: 'Nunito', sans-serif; font-weight: 500; font-size: 12.5px;
      color: rgba(246,246,246,0.32); line-height: 1.7; margin-top: 34px;
    }

    .footer-sig {
      margin-top: 30px;
      font-family: 'Sora', sans-serif; font-weight: 700; font-size: 10px;
      color: rgba(246,246,246,0.14); letter-spacing: 0.08em; text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">

      <div class="eyebrow-row"><span class="eyebrow">🎯 Atendimento Exclusivo</span></div>

      <h1 class="headline">Suporte Prioritário</h1>
      <p class="brand-line">Marcos Brito</p>

      <p class="desc">
        O atendimento é <strong>só pelo WhatsApp</strong>. Toca no botão abaixo, manda sua mensagem e a equipe te responde por lá.
      </p>

    </div>
  </div>
</body>
</html>
